name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test (${{ matrix.elixir }}, ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ['1.15.8', '1.16.3', '1.17.3', '1.18.1']
        otp: ['26.2', '27.2']
        exclude:
          - elixir: '1.15.8'
            otp: '27.2'
          - elixir: '1.16.3'
            otp: '27.2'
        include:
          - elixir: '1.19.5'
            otp: '28.3'
            coverage: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run compile and lint checks
        if: ${{ !matrix.coverage }}
        run: mix precommit_checks

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: mix test

      - name: Run full pre-commit checks with coverage threshold
        if: matrix.coverage
        run: mix precommit

      # Run only the tagged FIN+ACK RTO pair on the canonical coverage toolchain;
      # `--only` selects it without enabling inherited slow or integration tests.
      - name: Run FIN ACK RTO regression
        if: matrix.coverage
        timeout-minutes: 5
        run: mix test --only fin_ack_rto

      # coveralls.github uploads a fresh run but does not enforce minimum_coverage;
      # the canonical leg's mix precommit above owns the 80% threshold.
      - name: Upload coverage
        if: matrix.coverage
        run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
